name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloud-lab1-app
  ROLE_ARN: arn:aws:iam::299533424924:role/cloud-lab1-github-actions-role
  INSTANCE_NAME: cloud-lab1-app
  ALB_NAME: cloud-lab1-alb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CLAIMS=$(echo "$TOKEN" | python3 -c 'import sys,base64,json;p=sys.stdin.read().split(".")[1];c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4)));print(json.dumps({k:c.get(k) for k in ("iss","aud","sub")}))')
          echo "::warning::OIDC claims: $CLAIMS"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to EC2 via SSM Run Command
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$INSTANCE_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          echo "Instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${{ github.sha }}" \
            --parameters '{"commands":["/usr/local/bin/deploy-app.sh ${{ github.sha }}"]}' \
            --query Command.CommandId --output text)

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            echo "SSM status: $STATUS"
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query '[StandardOutputContent,StandardErrorContent]' --output text
                exit 1 ;;
            esac
            sleep 5
          done
          [ "$STATUS" = "Success" ] || { echo "Deploy timed out"; exit 1; }

      - name: Smoke test through ALB
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)
          for i in $(seq 1 24); do
            if curl -fs "http://$ALB_DNS/" | grep -q "${{ github.sha }}"; then
              curl -s "http://$ALB_DNS/"; echo; exit 0
            fi
            sleep 5
          done
          echo "New version is not visible at http://$ALB_DNS/"; exit 1
