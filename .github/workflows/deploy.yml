name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: cloud-lab1-app
  ROLE_ARN: arn:aws:iam::022083139955:role/cloud-lab1-github-actions-role
  INSTANCE_NAME: cloud-lab1-app
  ALB_NAME: cloud-lab1-alb

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          CLAIMS=$(echo "$TOKEN" | python3 -c 'import sys,base64,json;p=sys.stdin.read().split(".")[1];c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4)));print(json.dumps({k:c.get(k) for k in ("iss","aud","sub")}))')
          echo "::warning::OIDC claims: $CLAIMS"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      - name: Deploy to the Auto Scaling Group via SSM
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          aws ssm put-parameter \
            --name "/cloud-lab1/image_tag" \
            --value "$IMAGE_TAG" \
            --type String \
            --overwrite

          deploy_named() {
            local name="$1"
            local script="$2"
            local required="$3"
            local ids
            ids=$(aws ec2 describe-instances \
              --filters "Name=tag:Name,Values=${name}" "Name=instance-state-name,Values=running" \
              --query 'Reservations[].Instances[].InstanceId' --output text)
            if [ -z "$ids" ] || [ "$ids" = "None" ]; then
              echo "No running instances for ${name}"
              if [ "$required" = "yes" ]; then
                exit 1
              fi
              return 0
            fi
            echo "Deploy ${name}: ${ids}"
            local command_id
            command_id=$(aws ssm send-command \
              --instance-ids ${ids} \
              --document-name AWS-RunShellScript \
              --comment "deploy ${IMAGE_TAG}" \
              --parameters "{\"commands\":[\"cloud-init status --wait > /dev/null || true\",\"${script} ${IMAGE_TAG}\"]}" \
              --query Command.CommandId --output text)
            local instance_id status
            for instance_id in ${ids}; do
              status="Pending"
              for _ in $(seq 1 60); do
                status=$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" --query Status --output text 2>/dev/null || echo Pending)
                echo "${instance_id}: ${status}"
                case "$status" in
                  Success) break ;;
                  Failed|Cancelled|TimedOut)
                    aws ssm get-command-invocation --command-id "$command_id" --instance-id "$instance_id" \
                      --query '[StandardOutputContent,StandardErrorContent]' --output text
                    exit 1 ;;
                esac
                sleep 5
              done
              if [ "$status" != "Success" ]; then
                echo "Deploy timed out on ${instance_id}"
                exit 1
              fi
            done
          }

          deploy_named "$INSTANCE_NAME" "/usr/local/bin/deploy-app.sh" yes

      - name: Smoke test through ALB
        run: |
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" \
            --query 'LoadBalancers[0].DNSName' --output text)
          for i in $(seq 1 36); do
            if curl -fs "http://$ALB_DNS/" | grep -q "${{ github.sha }}"; then
              curl -s "http://$ALB_DNS/"; echo; exit 0
            fi
            sleep 5
          done
          echo "New version is not visible at http://$ALB_DNS/"; exit 1
